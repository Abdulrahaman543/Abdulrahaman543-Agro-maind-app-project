version: '3.8'

services:
  backend:
    build:
      context: ./docker
      dockerfile: backend.Dockerfile
    volumes:
      - ./backend/app:/app
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - DATABASE_URL=sqlite:///./test.db
      - SECRET_KEY=your_secret_key
      - AI_SERVICE_URL=http://ai_service:5000

  frontend:
    build:
      context: ./docker
      dockerfile: frontend.Dockerfile
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "8080:8080"
    environment:
      - VUE_APP_API_URL=http://backend:8000/api/v1

  ai_service:
    image: your_ai_service_image
    ports:
      - "5000:5000"
    environment:
      - AI_MODEL_PATH=/models/your_model

networks:
  default:
    driver: bridge